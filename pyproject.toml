[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfd3-pipeline"
version = "0.1.0"
description = "RFD3 protein binder design pipeline for Modal"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "biotite>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Kept out of the base dependencies so the GPU-free modules (metrics, rfd3_spec)
# install into a folding image without dragging in anything they do not need.
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
